[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "site-archiver"
version = "1.0.0"
description = "Resumable, fault-tolerant website archival crawler with JavaScript rendering"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx[http2]>=0.27,<1.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
]

[project.optional-dependencies]
render = ["playwright>=1.40"]
images = ["Pillow>=10.0"]
yaml = ["PyYAML>=6.0"]
test = ["pytest>=8.0", "pytest-asyncio>=0.23"]
all = [
    "playwright>=1.40",
    "Pillow>=10.0",
    "PyYAML>=6.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
site-archiver = "crawler.cli:main"

[tool.setuptools]
packages = ["crawler"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
